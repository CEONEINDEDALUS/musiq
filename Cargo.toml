[package]
name = "musiq"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal Linux music player"

[dependencies]
# Pure-Rust immediate-mode GUI (eframe = winit + egui)
eframe = "0.30"

# Audio decode + playback (ALSA/PulseAudio/PipeWire backend)
rodio = { version = "0.19", features = ["symphonia-all"] }

# Audio tag reading: ID3 (MP3), Vorbis (OGG/FLAC), MP4 (M4A/AAC), AIFF
lofty = "0.20"

# Efficient recursive directory traversal
walkdir = "2"

# Native file/folder picker (pure Rust, uses xdg-portal on Linux)
rfd = "0.14"

# Image decoding (for embedded album art)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Runs blocking work in a thread; perfect for the async file dialog
poll-promise = "0.3"

# Serialization for persistent state
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
